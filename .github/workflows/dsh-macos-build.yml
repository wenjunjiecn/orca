name: DSH macOS development build

on:
  push:
    branches: ['feat/dsh-native-chat-v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dsh-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'wenjunjiecn/orca' && startsWith(github.ref, 'refs/heads/feat/dsh-native-chat-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            machine: arm64
            app: dist/mac-arm64/Orca.app
          - arch: x64
            runner: macos-15-intel
            machine: x86_64
            app: dist/mac/Orca.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install locked dependencies for both macOS architectures
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Check build tools and macOS entitlements
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(pnpm exec bun --version)" = "$(node -p 'require("./package.json").devDependencies.bun')"
          pnpm verify:macos-entitlements

      - name: Type-check and build desktop outputs
        run: pnpm run build:desktop:ci

      - name: Build macOS helpers and prepare Electron
        run: |
          pnpm run build:native
          pnpm run ensure:electron-runtime

      - name: Package without publishing to GitHub Releases
        env:
          MAC_ARCH: ${{ matrix.arch }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          export ORCA_LOCAL_BUILD_VERSION="$version-local.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.g${ORCA_BUILD_COMMIT:0:12}"
          pnpm exec electron-builder --config config/electron-builder.config.cjs \
            --mac dmg zip "--$MAC_ARCH" --publish never -c.mac.identity=-

      - name: Verify architecture and stage installer files
        env:
          MAC_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
          MAC_APP: ${{ matrix.app }}
        run: |
          test "$(lipo -archs "$MAC_APP/Contents/MacOS/Orca")" = "$EXPECTED_MACHINE"
          codesign --verify --deep --strict "$MAC_APP"
          test -s "dist/orca-macos-$MAC_ARCH.dmg"
          hdiutil verify "dist/orca-macos-$MAC_ARCH.dmg"
          set -- dist/*.zip
          test "$#" -eq 1
          test -s "$1"
          unzip -tq "$1"
          mkdir installers
          cp "dist/orca-macos-$MAC_ARCH.dmg" "installers/Orca-DSH-$MAC_ARCH.dmg"
          cp "$1" "installers/Orca-DSH-$MAC_ARCH.zip"
          (cd installers && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt)

      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v7
        with:
          name: orca-dsh-macos-${{ matrix.arch }}
          path: installers/
          if-no-files-found: error
          compression-level: 0
